   let currentIndex = 0;
    const video = document.getElementById('video');
    const channelInfo = document.getElementById('channel-info');
    const channelListDiv = document.getElementById('channel-list');
    let hls = null;

    // Helper: Clean up URL to show a readable name
    function getChannelName(url) {
        try {
            const part = url.split('/')[4];
            return part.replace('.stream', '').replace('net', '').replace('1500', '').toUpperCase();
        } catch(e) { return "CHANNEL"; }
    }

    // Populate the Sidebar
    function buildSidebar() {
        channels.forEach((url, index) => {
            const name = getChannelName(url);
            const item = document.createElement('div');
            item.className = 'channel-item' + (index === 0 ? ' active' : '');
            item.id = `ch-${index}`;
            item.innerText = `${index + 1}. ${name}`;
            item.onclick = () => {
                currentIndex = index;
                loadChannel(index);
            };
            channelListDiv.appendChild(item);
        });
    }

    function loadChannel(index) {
        const url = channels[index];
        const name = getChannelName(url);
        channelInfo.innerText = name;

        // Update active class in sidebar
        document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
        document.getElementById(`ch-${index}`).classList.add('active');

        // Playback logic
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => video.play());
        }
    }

    function nextChannel() {
        currentIndex = (currentIndex + 1) % channels.length;
        loadChannel(currentIndex);
    }

    function prevChannel() {
        currentIndex = (currentIndex - 1 + channels.length) % channels.length;
        loadChannel(currentIndex);
    }

    function toggleFullscreen() {
        const wrapper = document.getElementById('wrapper');
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    }

    // Initial setup
    buildSidebar();
    loadChannel(0);
</script>
